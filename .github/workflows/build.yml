name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (ej: v1.2.0)"
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DeskControl-${{ inputs.version }}.apk
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: DeskControl-${{ inputs.version }}.apk
          path: app/build/app/outputs/flutter-apk/DeskControl-${{ inputs.version }}.apk

  daemon-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build -ldflags="-s -w" -o DeskControl-${{ inputs.version }}-linux ./cmd/deskcontrol-ui/
        working-directory: daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DeskControl-${{ inputs.version }}-linux
          path: daemon/DeskControl-${{ inputs.version }}-linux

  daemon-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/fyne-io/fyne-cross@latest
      - run: |
          fyne-cross windows \
            -app-id com.deskcontrol.daemon \
            -name "DeskControl" \
            -output DeskControl-${{ inputs.version }}-windows.exe \
            ./cmd/deskcontrol-ui
        working-directory: daemon
      - run: mv fyne-cross/dist/windows-amd64/DeskControl-${{ inputs.version }}-windows.exe .
        working-directory: daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DeskControl-${{ inputs.version }}-windows.exe
          path: daemon/DeskControl-${{ inputs.version }}-windows.exe

  release:
    needs: [apk, daemon-linux, daemon-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: DeskControl ${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            DeskControl-${{ inputs.version }}.apk/*
            DeskControl-${{ inputs.version }}-linux/*
            DeskControl-${{ inputs.version }}-windows.exe/*
